# ──────────────────────────────────────────────────────────────────────────────
# WarriorView — 字符替换规则（char-replace.yml）
#
# 每个顶层键定义一套命名规则，可在 indicator/ 配置文件的 char-replace 字段中引用。
#
# 格式：每个键下为 原始字符→替换字符串 的映射
#   key   : 单个字符（用引号括起，避免 YAML 解析歧义）
#   value : 替换后的字符串（可为多字符）
#
# Latin-1（码点 0-255）字符使用 String[256] 数组 O(1) 寻址；
# 高码点字符（>255）通过 HashMap 回退寻址。
# 若输入中无可替换字符，零分配（直接返回原字符串引用）。
#
# 若某条指示器配置不指定 char-replace，则不进行字符替换。
# ──────────────────────────────────────────────────────────────────────────────

# 双线数字风格（Unicode Mathematical Double-Struck）
double-struck:
  "0": "𝟘"
  "1": "𝟙"
  "2": "𝟚"
  "3": "𝟛"
  "4": "𝟜"
  "5": "𝟝"
  "6": "𝟞"
  "7": "𝟟"
  "8": "𝟠"
  "9": "𝟡"
  ".": "·"

# 粗体无衬线风格（Unicode Mathematical Sans-Serif Bold）
bold-sans:
  "0": "𝟬"
  "1": "𝟭"
  "2": "𝟮"
  "3": "𝟯"
  "4": "𝟰"
  "5": "𝟱"
  "6": "𝟲"
  "7": "𝟳"
  "8": "𝟴"
  "9": "𝟵"
  ".": "."
