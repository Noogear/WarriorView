# ──────────────────────────────────────────────────────────────────────────────
# WarriorView 全局配置
# 修改后执行 /warriorview reload all 即可生效。
# ──────────────────────────────────────────────────────────────────────────────

# ── 调度器（RapidTransientScheduler）──────────────────────────────────────────
# 高性能无锁任务调度器参数。通常无需修改。
scheduler:
  # 时间轮大小（必须为 2 的幂次方，如 32 / 64 / 128）
  # 决定任务延迟精度和调度桶数量
  wheel-size: 64

  # 对象池容量（必须为 2 的幂次方）
  # 更大的池可减少 GC 压力，但占用更多内存
  pool-capacity: 1024

  # 每 tick 最大执行任务数（限流）
  # 防止瞬间大量任务阻塞服务器主线程
  max-tasks-per-tick: 500

  # 连续空闲多少 tick 后调度器进入休眠
  # 30 秒 = 600 ticks（2 tick = 100ms → 600 tick = 30s）
  idle-threshold: 600

# Plugin integrations
integrations:
  placeholderapi:
    enabled: true
  luckperms:
    enabled: true
# ── 调试 ──────────────────────────────────────────────────────────────────────
# 是否在控制台输出每次重载的耗时日志
timing-log: true
