# ──────────────────────────────────────────────────────────────────────────────
# WarriorView 全局配置
# 修改后执行 /warriorview reload all 即可生效。
# ──────────────────────────────────────────────────────────────────────────────

# ── 调度器 ────────────────────────────────────────────────────────────────────
scheduler:
  # 每 tick 最大执行任务数（限流），防止瞬间积压阻塞
  max-tasks-per-tick: 500
  # 连续空闲多少 tick 后进入休眠（2 tick = 100 ms，600 tick ≈ 30 s）
  idle-threshold: 600
  # 积压消耗倍率：检测到积压时有效配额 = max-tasks-per-tick × backlog-burst-multiplier
  # 设为 1 可关闭自适应；推荐 2~3（在瞬时流量突增时自动追赶积压，不影响正常 tick 开销）
  backlog-burst-multiplier: 3


# ── 指示器变体（variants） ─────────────────────────────────────────────────────
variants:
  # 回退到 Bukkit 权限 API 时，变体缓存的轮询刷新间隔（调度器活跃 Tick）。
  # 默认 200 Tick ≈ 10 秒。安装并启用 LuckPerms 时此项无效（事件驱动精确失效）。
  permission-cache-refresh-ticks: 200


# ── 集成 ──────────────────────────────────────────────────────────────────────
integrations:
  placeholderapi:
    # 启用后在插件加载/重载时解析配置中的全局 PAPI 占位符（如 %server_name%）。
    # 需安装 PlaceholderAPI 插件；未安装时自动跳过。
    # 注意：仅支持全局占位符，不支持玩家相关占位符（如 %player_name%）。
    enabled: true
  luckperms:
    # 启用后权限查询直接访问 LuckPerms 内存缓存，性能更高且权限变更即时生效。
    # 需安装 LuckPerms 插件；未安装时自动回退到 Bukkit 权限 API。
    enabled: true


# ── 调试 ──────────────────────────────────────────────────────────────────────
# 是否在控制台输出每次重载的耗时日志
timing-log: true
