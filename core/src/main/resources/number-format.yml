# ──────────────────────────────────────────────────────────────────────────────
# WarriorView — 数字量化缩写规则（number-format.yml）
#
# 每个顶层键定义一套命名规则，可在 indicator/ 配置文件的 number-format 字段中引用。
#
# 格式：每个键下直接为 阈值→后缀 的映射
#   key   : 真实阈值数字（达到或超过此值启用对应后缀）
#   value : 后缀字符串（附加在格式化数字之后）
#
# 例如：1000 配置为 "K"，则 1234 → "1.2K"（精度由 indicator/ 中的 decimal-places 控制）
#
# 若某条指示器配置不指定 number-format，则不进行量化缩写。
# ──────────────────────────────────────────────────────────────────────────────

# 通用 K / M / B 缩写
compact:
  1000:       "K"
  1000000:    "M"
  1000000000: "B"
