# ============================================================
#  WarriorView — 动画使用示例
#  展示如何引用预设、使用模板、覆盖参数、直接定义动画
#
#  本文件中定义的动画可直接在 indicator 配置的 `animation` 字段中引用
#
#  文件结构概览：
#    animations/*.yml           → animation: 下定义动画
#    animations/presets/*.yml   → preset: 下定义预设/模板
#
#  引用链路：
#    indicator.yml → animation: "名称" → 本文件 animation: 下的定义
#    本文件 → type: preset, id: xxx  → presets/*.yml 中的预设/模板
# ============================================================

animation:

  # =============================================
  #  第一部分：直接引用预设（零配置，最简单）
  # =============================================

  # ----------------------------------------------------------
  # 示例 1：最简引用 — 一行搞定
  # gentle_rise 来自 presets/basic.yml
  # 效果：温柔上浮淡出
  # ----------------------------------------------------------
  simple_damage:
    type: preset
    id: gentle_rise

  # ----------------------------------------------------------
  # 示例 2：引用并覆盖显示设置
  # 动画轨迹复用 arc_toss 预设，额外增大可见距离
  # settings 覆盖不影响动画轨迹本身
  # ----------------------------------------------------------
  ranged_damage:
    type: preset
    id: arc_toss
    settings:
      view-range: 32                      # 远程战斗需要更大可见距离
      text-shadow: true

  # ----------------------------------------------------------
  # 示例 3：覆盖多项设置 — 穿墙 AOE
  # scatter_pop 的四散效果 + 穿墙可见 + 红色半透明背景
  # ----------------------------------------------------------
  aoe_damage:
    type: preset
    id: scatter_pop
    settings:
      see-through: true                   # 穿墙可见（AOE 可能被方块遮挡）
      background: "#40FF0000"             # 半透明红色背景 (AA=40, R=FF)
      view-range: 36

  # ----------------------------------------------------------
  # 示例 4：暴击 — 脉冲闪现
  # 原地缩放脉冲吸引注意力
  # ----------------------------------------------------------
  critical_flash:
    type: preset
    id: pulse_flash
    settings:
      text-shadow: true
      glow-color: 16763904                # 金黄色发光 (0xFFD700)

  # ----------------------------------------------------------
  # 示例 5：BUFF 提示 — 驻留显示
  # 文字停留较久便于阅读
  # ----------------------------------------------------------
  buff_notice:
    type: preset
    id: linger_fade
    settings:
      background: "#6000AA00"             # 半透明绿色背景

  # ----------------------------------------------------------
  # 示例 6：魔法伤害 — 膨胀消散
  # ----------------------------------------------------------
  magic_dissolve:
    type: preset
    id: grow_dissolve

  # ----------------------------------------------------------
  # 示例 7：弹跳暴击
  # ----------------------------------------------------------
  bounce_crit:
    type: preset
    id: spring_bounce

  # ----------------------------------------------------------
  # 示例 8：摔落伤害 — 坠落反弹
  # ----------------------------------------------------------
  fall_damage:
    type: preset
    id: drop_rebound

  # ----------------------------------------------------------
  # 示例 9：眩晕效果 — 钟摆摇晃
  # ----------------------------------------------------------
  dizzy_damage:
    type: preset
    id: tilt_sway

  # =============================================
  #  第二部分：直接定义完整动画
  # =============================================

  # ----------------------------------------------------------
  # 示例 17：关键帧 + 固定朝向 + 原生四元数旋转
  # 适用于需要精确控制旋转的特殊效果
  #
  # billboard: fixed 必须配合旋转才有意义
  # right_rotation 使用欧拉角 [x°, y°, z°] (3元素)
  # 3 元素 = 欧拉角（度），4 元素 = 四元数 [x,y,z,w]
  # ----------------------------------------------------------
  custom_spin_float:
    type: keyframe
    space: world
    settings:
      billboard: fixed                    # 固定朝向（旋转才可见）
      text-shadow: true
      background: "transparent"
      view-range: 24
      offset:
        x: "r * 0.4 - 0.2"
        y: "r * 0.2"
        z: "r * 0.4 - 0.2"

    timeline:
      - time: 0
        translation: [0, 0, 0]
        scale: [1.0, 1.0, 1.0]
        right_rotation: [0, 0, 0]         # 欧拉角 [x°, y°, z°] = 无旋转
        text_opacity: 127                  # 完全不透明 (0=透明, 127=不透明)

      - duration: 10
        translation: [0, 0.3, 0]
        right_rotation: [0, 90, 0]        # Y 轴旋转 90°

      - duration: 10
        translation: [0, 0.6, 0]
        right_rotation: [0, 180, 0]       # Y 轴旋转 180°
        text_opacity: 80

      - duration: 10
        translation: [0, 0.9, 0]
        scale: [0.6, 0.6, 0.6]
        right_rotation: [0, 270, 0]       # Y 轴旋转 270°（不超过 180° 每段避免四元数问题）
        text_opacity: 0

  # ----------------------------------------------------------
  # 示例 18：方程式 — 花瓣形轨迹（玫瑰线/rhodonea）
  # 利用三角函数组合创造花形路径
  #
  # 原理：r(θ) = |sin(1.5θ)|，极坐标转笛卡尔坐标
  #   x = sin(θ) × r(θ)，z = cos(θ) × r(θ)
  #   θ = 0.1t，63 tick 内 θ 走过 0 ~ 2π
  #   1.5 = 3/2 产生 3 瓣花形
  # ----------------------------------------------------------
  petal_orbit:
    type: equation
    settings:
      billboard: center
      text-shadow: true
      background: "transparent"
      view-range: 28

    duration: 63
    sample_interval: 2

    math:
      position:
        x: "sin(t * 0.1) * abs(sin(t * 0.15)) * 0.5"
        y: "t * 0.02"                    # 极缓慢上浮
        z: "cos(t * 0.1) * abs(sin(t * 0.15)) * 0.5"
      scale:
        x: "max(0.4, 1.0 - t * 0.01)"
        y: "max(0.4, 1.0 - t * 0.01)"
        z: "max(0.4, 1.0 - t * 0.01)"
      opacity: "max(0, 127 - t * 2)"

  # ----------------------------------------------------------
  # 示例 19：视角坐标 + 方程式 — 前方螺旋飞出
  # space: view 使轨迹跟随攻击者朝向
  #
  # +X = 攻击者右方，+Z = 攻击者前方
  # 效果：文字向攻击者正前方螺旋飞出
  # ----------------------------------------------------------
  forward_spiral:
    type: equation
    space: view                           # 视角坐标系
    settings:
      billboard: center
      text-shadow: true
      background: "transparent"

    duration: 40
    sample_interval: 2

    math:
      position:
        x: "sin(t * 0.3) * 0.3"          # 左右摆动（攻击者视角的左右）
        y: "t * 0.03"                     # 轻微上浮
        z: "t * 0.04"                     # 向前飞出（+Z = 攻击者前方）
      opacity: "max(0, 127 - t * 3.2)"

  # =============================================
  #  第四部分：视角坐标系 (space: view) 使用示例
  #  让动画轨迹跟随攻击者的面朝方向
  # =============================================

  # ----------------------------------------------------------
  # 示例 20：引用视角坐标预设 — 右斩飞出
  # arc_toss 来自 presets/basic.yml（space: view）
  # 文字始终飞向攻击者右手边，无论攻击者面朝哪个方向
  # ----------------------------------------------------------
  melee_slash:
    type: preset
    id: arc_toss

  # ----------------------------------------------------------
  # 示例 21：引用视角坐标预设 — 冲锋爆发
  # 数字向攻击者正前方冲出后减速，跟随被击退方向
  # ----------------------------------------------------------
  kb_hit:
    type: preset
    id: charge_burst
    settings:
      view-range: 28

  # ----------------------------------------------------------
  # 示例 22：引用视角坐标预设 — 冲锋爆发
  # ----------------------------------------------------------
  charge_skill:
    type: preset
    id: charge_burst

  # ----------------------------------------------------------
  # 示例 23：引用视角坐标预设 — 散射伤害
  # 多个数字形成扇形散开，适合霰弹枪式多段伤害
  # ----------------------------------------------------------
  shotgun_damage:
    type: preset
    id: cone_scatter

  # ----------------------------------------------------------
  # 示例 29：视角坐标 + 方程式 — 回旋弧线
  # boomerang_arc 来自 presets/equation.yml
  # 文字先向攻击者右前方飞出，再弧线折返向左
  # ----------------------------------------------------------
  boomerang_hit:
    type: preset
    id: boomerang_arc
