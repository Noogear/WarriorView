# ──────────────────────────────────────────────────────────────────────────────
# 指示器 Action 配置
#
# 每个顶层键对应一个 tag（标记），当脚本触发 showIndicator action 时
# 传入的第三个参数（tag）会匹配此处的键名，以确定 TextDisplay 的显示参数
# 和生成策略。匹配不到时回退到 default。
#
# 配置字段说明：
#   text-format        : MiniMessage 模板，{damage} 占位符替换为格式化后的伤害数值
#   decimal-places     : 伤害数值保留的小数位数（int，默认 1）
#   position           : 生成位置算法 —— AIM / SURFACE / IMPACT / ORIGIN
#   animation          : 关联的动画定义名称（在 animations/ 目录中定义）
#   billboard          : TextDisplay 朝向约束 —— CENTER / VERTICAL / HORIZONTAL / FIXED
#   see-through        : 是否穿透方块渲染（布尔值，默认 false）
#   text-shadow        : 是否显示文字阴影（布尔值，默认 true）
#   background         : ARGB 背景颜色（0xAARRGGBB 格式或十进制整数，默认 0x40000000）
#   view-range         : 客户端可见距离倍率（float，默认 1.0）
#   teleport-duration  : 位置 / 旋转插值 tick 数（int，默认 0 = 立即传送）
#   brightness         : 亮度覆盖（int，-1 = 使用世界光照）
#   shadow-radius      : 地面阴影半径（float，默认 0）
#   shadow-strength    : 地面阴影强度（float，默认 1.0）
#   glow-color         : 发光颜色覆盖（RGB int，默认 0）
#   line-width         : 文本最大行宽像素（int，默认 200）
#   only-player        : 为 true 时仅在攻击者为玩家时触发指示器（默认 true）
#   number-format      : 数字量化缩写规则名称（引用 number-format.yml，null = 不缩写）
#   char-replace       : 字符替换规则名称（引用 char-replace.yml，null = 不替换）
# ──────────────────────────────────────────────────────────────────────────────

# 全局兜底配置（tag 匹配不到时使用）
default:
  text-format: "<white>{damage}"
  position: AIM
  animation: critical_hit
  billboard: CENTER
  see-through: false
  text-shadow: true
  background: 0x40000000
  view-range: 32.0
  only-player: true

# 暴击
CRITICAL:
  text-format: "<red><bold>✦ {damage}"
  position: AIM
  animation: critical_hit
  billboard: CENTER
  see-through: false
  text-shadow: true
  background: 0x40000000
  view-range: 48.0
  only-player: true

# 近战实体攻击
ENTITY_ATTACK:
  text-format: "<white>{damage}"
  position: AIM
  animation: critical_hit

# 投射物（弓箭、三叉戟等）：投射物实体本身充当 attacker，位置即撞击点，IMPACT 的 tMin ≈ 0，命中检测准确
PROJECTILE:
  text-format: "<yellow>➶ {damage}"
  position: IMPACT
  animation: critical_hit

# 区域伤害 / 爆炸
ENTITY_EXPLOSION:
  text-format: "<gold>💥 {damage}"
  position: SURFACE
  animation: critical_hit
  only-player: false

# 自身反馈（附魔反伤、荆棘等）
THORNS:
  text-format: "<green>⚡ {damage}"
  position: ORIGIN
  animation: critical_hit
